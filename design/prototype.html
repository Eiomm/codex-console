<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 控制台 原型</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Martian Mono Variable"; src: url("fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
:root {
  --void: #05070D; --panel: #0B0F19; --raised: #111726; --line: #22304A; --hot: #3A5578;
  --text: #D9E4F2; --dim: #8494AC; --claude: #FF7A45; --codex: #25E2FF; --human: #F7E733; --bad: #FF3B6B; --ok: #3DF5A0;
  --mono: "Martian Mono Variable", "PingFang SC", monospace; --zh: "PingFang SC", "Martian Mono Variable", sans-serif;
  --cut: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--text); font: 400 12.5px/1.5 var(--zh); -webkit-font-smoothing: antialiased; }
body { background-image: linear-gradient(rgba(58,85,120,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(58,85,120,.10) 1px, transparent 1px); background-size: 32px 32px; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--human); outline-offset: 2px; }

.app { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 100vh; }

/* Chamfered frame: the outer layer is the 1px line, the inner layer is the fill. */
.mod { position: relative; background: var(--line); clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); min-width: 0; }
.mod > .in { position: absolute; inset: 1px; background: var(--panel); clip-path: inherit; }
.mod > .body { position: relative; height: 100%; display: flex; flex-direction: column; min-height: 0; }
.mod-h { display: flex; align-items: center; gap: 8px; padding: 8px 14px 6px; flex-wrap: wrap; }
.tag { font: 500 10.5px var(--mono); letter-spacing: .08em; color: var(--dim); }
.mod-h h2 { margin: 0; font-size: 13px; font-weight: 600; }

.top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 8px 14px; }
.brand { font: 600 13px var(--mono); letter-spacing: .02em; white-space: nowrap; }
.brand i { font-style: normal; color: var(--codex); }
.task { flex: 1 1 220px; min-width: 0; display: flex; gap: 10px; align-items: baseline; }
.task b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 400 11px var(--mono); color: var(--dim); white-space: nowrap; }
.rounds { display: flex; align-items: center; gap: 5px; color: var(--dim); white-space: nowrap; }
.rounds i { width: 10px; height: 4px; background: var(--line); }
.rounds i.on { background: var(--text); }
.clock { font: 500 13px var(--mono); }
.btn { height: 28px; padding: 0 12px; border: 1px solid var(--hot); background: transparent; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.go { border-color: var(--human); color: var(--void); background: var(--human); font-weight: 600; }
.btn.go:hover { background: #FFF45E; }

.grid { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); flex: 1; }
.tele { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
@media (min-width: 1040px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(320px, 30%); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "flow insp" "tele tele"; }
  .flow-m { grid-area: flow; } .insp-m { grid-area: insp; } .tele { grid-area: tele; }
}

.now { display: flex; align-items: center; gap: 10px; margin: 0 14px 4px; padding: 8px 10px; background: var(--raised); border-left: 2px solid var(--who, var(--dim)); min-height: 40px; }
.now .lbl { font: 500 10.5px var(--mono); letter-spacing: .08em; color: var(--who, var(--dim)); flex: none; }
.now .txt { font-size: 14px; font-weight: 500; min-width: 0; }
.now .txt::after { content: "▌"; margin-left: 4px; color: var(--who, var(--dim)); animation: caret 1s steps(2) infinite; }
@keyframes caret { 50% { opacity: 0; } }

#flow { display: block; width: 100%; height: auto; padding: 0 8px 4px; overflow: visible; }
.trace { fill: none; stroke: var(--line); stroke-width: 1.5; }
.trace.back { stroke-dasharray: 5 4; }
.glow { fill: none; stroke-width: 7; opacity: 0; transition: opacity .3s linear; }
.hot { fill: none; stroke-width: 2; opacity: 0; transition: opacity .3s linear; }
.edge-on .glow { opacity: .16; }
.edge-on .hot { opacity: 1; }
.edge-l { font: 400 10.5px var(--zh); fill: var(--dim); }
.edge-on .edge-l { fill: var(--text); }
.node { cursor: pointer; }
.node .frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.node.active .frame { stroke: var(--c); stroke-width: 1.5; fill: var(--raised); }
.node .halo { fill: none; stroke: var(--c); stroke-width: 6; opacity: 0; transition: opacity .3s linear; }
.node.active .halo { opacity: .22; }
.node.sel .frame { fill: var(--raised); }
.node .mark { fill: var(--c); opacity: 0; }
.node.sel .mark { opacity: 1; }
.node:hover .frame { stroke: var(--hot); }
.node.active:hover .frame { stroke: var(--c); }
.node:focus-visible { outline: none; }
.node:focus-visible .frame { stroke: var(--human); stroke-width: 2; }
.n-t { font: 600 13.5px var(--zh); fill: var(--text); }
.n-w { font: 500 10.5px var(--mono); fill: var(--c); }
.n-r { font: 400 11px var(--zh); fill: var(--dim); }
.n-v { font: 500 19px var(--mono); fill: var(--text); letter-spacing: -.03em; }
.n-u { font: 400 10.5px var(--zh); fill: var(--dim); }
.n-s { font: 400 11px var(--mono); fill: var(--dim); }
.node.active .n-s { fill: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 14px 10px; font-size: 11px; color: var(--dim); align-items: center; }
.legend i { display: inline-block; width: 8px; height: 3px; margin-right: 6px; vertical-align: middle; }

.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 6px 10px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--c, var(--text)); }
.what { margin: 0; padding: 0 14px 8px; color: var(--dim); }
.panes { flex: 1; min-height: 180px; overflow-y: auto; padding: 4px 0 8px; }
@media (min-width: 1040px) { .panes { height: 0; } }
.rows { list-style: none; margin: 0; padding: 0; font: 400 11.5px/1.5 var(--mono); }
.rows li { display: grid; grid-template-columns: 42px 44px minmax(0, 1fr); gap: 8px; padding: 6px 14px; border-bottom: 1px solid rgba(34,48,74,.55); }
.rows time { color: var(--dim); }
.kind { font: 400 10.5px var(--zh); color: var(--dim); }
.kind.issue { color: var(--bad); font-weight: 600; }
.res { color: var(--dim); }
.res.bad { color: var(--bad); }
.empty { padding: 14px; color: var(--dim); }
.files { list-style: none; margin: 0; padding: 0 14px; font: 400 11.5px var(--mono); }
.files li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; }
.plus { color: var(--ok); } .minus { color: var(--bad); }
pre.diff { margin: 4px 14px 0; padding: 8px; background: var(--void); font: 400 11px/1.6 var(--mono); overflow-x: auto; white-space: pre; }
.prompt { margin: 0 14px; padding: 8px; background: var(--void); font: 400 11.5px/1.65 var(--zh); white-space: pre-wrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.actions[hidden] { display: none; }

.t-body { padding: 0 14px 12px; }
.meter { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; align-items: center; gap: 8px; margin-top: 7px; font-size: 11.5px; }
.meter .who { white-space: nowrap; }
.track { height: 5px; background: var(--raised); }
.track i { display: block; height: 100%; width: 0; background: var(--c, var(--text)); transition: width .3s linear; }
.num { font: 500 11.5px var(--mono); white-space: nowrap; }
.sub { font-size: 11px; color: var(--dim); margin: 6px 0 0; }
.ic { width: 14px; height: 14px; fill: currentColor; vertical-align: -3px; margin-right: 4px; }
.c-claude { color: var(--claude); --c: var(--claude); } .c-codex { color: var(--codex); --c: var(--codex); }
#spark { display: block; width: 100%; height: 28px; margin-top: 6px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.field label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
select { width: 100%; height: 28px; background: var(--raised); border: 1px solid var(--line); padding: 0 6px; font: 400 11px var(--mono); }
.sw { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 0; background: none; border: 0; text-align: left; }
.sw .bar { width: 36px; height: 16px; border: 1px solid var(--hot); position: relative; flex: none; }
.sw .bar::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 10px; background: var(--dim); transition: left .1s linear; }
.sw[aria-checked="true"] .bar { border-color: var(--human); }
.sw[aria-checked="true"] .bar::after { left: 18px; background: var(--human); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.stats b { display: block; font: 500 19px var(--mono); }
.stats span { font-size: 11px; color: var(--dim); }
.tele .mod { min-height: 118px; }
@media (prefers-reduced-motion: reduce) { .now .txt::after { animation: none; } .glow, .hot, .halo { transition: none; } }
</style>
</head>

<div class="app">
  <header class="mod"><div class="in"></div><div class="body"><div class="top">
    <span class="brand">CODEX<i>//</i>控制台</span>
    <div class="task"><b>修复空窗口时的除零错误</b><span class="chip">target_link</span></div>
    <span class="chip">示例数据</span>
    <div class="rounds" aria-label="审查轮次"><span id="rt">第 1 轮</span><i id="r1" class="on"></i><i id="r2"></i><i id="r3"></i></div>
    <span class="clock" id="clock">00:00</span>
    <button class="btn" id="pause">暂停</button><button class="btn">停止</button>
  </div></div></header>

  <div class="grid">
    <section class="mod flow-m" id="flowMod" aria-label="协作流程"><div class="in"></div><div class="body">
      <div class="mod-h"><span class="tag">M01</span><h2>协作流程</h2></div>
      <div class="now" id="now"><span class="lbl">NOW</span><span class="txt" id="nowT"></span></div>
      <svg id="flow" role="img" aria-label="协作流程图"></svg>
      <div class="legend"><span><i style="background:var(--claude)"></i>Claude 工作中</span><span><i style="background:var(--codex)"></i>Codex 工作中</span><span><i style="background:var(--human)"></i>需要你决定</span><span>一个数据包约 2 千 token</span></div>
    </div></section>

    <section class="mod insp-m" aria-label="节点详情"><div class="in"></div><div class="body">
      <div class="mod-h" id="inspH"><span class="tag">M02</span><h2 id="iT"></h2></div>
      <p class="what" id="iW"></p>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panes" id="pane"></div>
      <div class="actions" id="actions" hidden><button class="btn go">合并到主分支</button><button class="btn">放弃这次改动</button></div>
    </div></section>

    <div class="tele">
      <section class="mod" aria-label="token 消耗"><div class="in"></div><div class="body">
        <div class="mod-h"><span class="tag">M03</span><h2>token</h2></div>
        <div class="t-body">
          <div class="meter c-claude" style="margin-top:0"><span class="who"><svg class="ic"><use href="#i-claude"/></svg>Claude</span><div class="track"><i id="bClaude"></i></div><span class="num" id="sClaude">0</span></div>
          <div class="meter c-codex"><span class="who"><svg class="ic"><use href="#i-codex"/></svg>Codex</span><div class="track"><i id="bCodex"></i></div><span class="num" id="sCodex">0</span></div>
          <svg id="spark" viewBox="0 0 200 28" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </div></section>
      <section class="mod" aria-label="额度"><div class="in"></div><div class="body">
        <div class="mod-h"><span class="tag">M04</span><h2>额度</h2></div>
        <div class="t-body">
          <div class="meter c-codex" style="margin-top:0"><span class="who">Codex 周</span><div class="track"><i style="width:1%"></i></div><span class="num">1%</span></div>
          <div class="meter c-claude"><span class="who">Claude 5 时</span><div class="track"><i style="width:5%"></i></div><span class="num">5%</span></div>
          <div class="meter c-claude"><span class="who">Claude 7 天</span><div class="track"><i style="width:49%"></i></div><span class="num">49%</span></div>
          <p class="sub">Codex 有 2 次免费重置</p>
        </div>
      </div></section>
      <section class="mod" aria-label="引擎"><div class="in"></div><div class="body">
        <div class="mod-h"><span class="tag">M05</span><h2>Codex 引擎</h2></div>
        <div class="t-body">
          <div class="field">
            <div><label for="m">模型</label><select id="m"><option>gpt-6-astra</option><option>gpt-6.1-sol</option><option>gpt-6.1-terra</option><option>gpt-6-luna</option></select></div>
            <div><label for="e">推理强度</label><select id="e"><option>low</option><option>medium</option><option selected>high</option><option>xhigh</option></select></div>
          </div>
          <button class="sw" role="switch" aria-checked="true" id="fast"><span class="bar"></span><span id="fastT">Fast 开，额度消耗约 ×2.5</span></button>
        </div>
      </div></section>
      <section class="mod" aria-label="本次任务"><div class="in"></div><div class="body">
        <div class="mod-h"><span class="tag">M06</span><h2>本次任务</h2></div>
        <div class="t-body stats">
          <div><b id="cCmd">0</b><span>条命令</span></div>
          <div><b id="cFile">0</b><span>个文件</span></div>
          <div><b id="cIssue">0</b><span>个问题</span></div>
        </div>
      </div></section>
    </div>
  </div>
</div>

const colorOf = w => `var(--${w})`;

const state = { tokens: {}, active: new Set(), status: {}, sel: 'plan', tab: 'act', logs: {}, files: {}, edges: {}, cmd: 0, file: 0, issue: 0, rate: [], round: 1 };

const fmt = n => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万' : n.toLocaleString('zh-CN');
const clip = (s, w) => { let u = 0, o = ''; for (const c of s) { u += c.charCodeAt(0) > 255 ? 1.85 : 1; if (u > w) return o + '…'; o += c; } return o; };
const stamp = () => { const s = Math.floor(elapsed / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

/* Right angles with a small diagonal, like a circuit board trace. */
function route(pts, r = 7) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const a = Math.min(r, Math.hypot(x - px, y - py) / 2), b = Math.min(r, Math.hypot(nx - x, ny - y) / 2);
    d += ` L${x - Math.sign(x - px) * a} ${y - Math.sign(y - py) * a} L${x + Math.sign(nx - x) * b} ${y + Math.sign(ny - y) * b}`;
  }
  const e = pts[pts.length - 1];
  return d + ` L${e[0]} ${e[1]}`;
}
const chamfer = (x, y, w, h, c = 9) => `${x},${y} ${x + w - c},${y} ${x + w},${y + c} ${x + w},${y + h} ${x + c},${y + h} ${x},${y + h - c}`;
function el(tag, attrs = {}, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}

let layout, mode, edgeEls = {}, nodeEls = {}, packetLayer, packets = [];
function draw() {
  const svg = $('flow');
  svg.textContent = '';
  svg.setAttribute('viewBox', `0 0 ${layout.box[0]} ${layout.box[1]}`);
  edgeEls = {}; nodeEls = {};
  for (const [id, e] of Object.entries(layout.e)) {
    const g = el('g', {}, svg);
    const d = route(e.pts);
    const glow = el('path', { d, class: 'glow' }, g);
    el('path', { d, class: 'trace' + (e.back ? ' back' : '') }, g);
    const hot = el('path', { d, class: 'hot' }, g);
    const last = e.pts[e.pts.length - 1], prev = e.pts[e.pts.length - 2];
    const ang = Math.atan2(last[1] - prev[1], last[0] - prev[0]) * 180 / Math.PI;
    el('path', { d: 'M-6 -4 L0 0 L-6 4', fill: 'none', stroke: 'var(--hot)', 'stroke-width': 1.5, transform: `translate(${last[0]} ${last[1]}) rotate(${ang})` }, g);
    el('text', { x: e.l[1], y: e.l[2], 'text-anchor': e.l[3], class: 'edge-l' }, g, e.l[0]);
    edgeEls[id] = { g, hot, glow, len: hot.getTotalLength() };
  }
  for (const [id, r] of Object.entries(layout.n)) {
    const [x, y, w, h] = r, def = NODES[id];
    const g = el('g', { class: 'node', tabindex: 0, role: 'button', 'aria-label': `${def.title}：${def.role}`, style: `--c:${colorOf(def.who)}` }, svg);
    el('polygon', { points: chamfer(x, y, w, h), class: 'halo' }, g);
    el('polygon', { points: chamfer(x, y, w, h), class: 'frame' }, g);
    el('rect', { x, y: y + 12, width: 2.5, height: h - 24, class: 'mark' }, g);
    el('text', { x: x + 14, y: y + 22, class: 'n-t' }, g, def.title);
    if (def.who !== 'human') {
      const ox = def.who === 'claude' ? 60 : 54;
      el('use', { href: `#i-${def.who}`, x: x + w - ox - 16, y: y + 11, width: 13, height: 13, style: `color:${colorOf(def.who)};fill:currentColor` }, g);
      el('text', { x: x + w - ox, y: y + 22, class: 'n-w' }, g, def.who === 'claude' ? 'Claude' : 'Codex');
    }
    el('text', { x: x + 14, y: y + 40, class: 'n-r' }, g, clip(def.role, (w - 24) / 6.1));
    let val = null, unit = null;
    if (id !== 'gate') { val = el('text', { x: x + 14, y: y + h - 26, class: 'n-v' }, g, '0'); unit = el('text', { x: x + 14, y: y + h - 26, class: 'n-u' }, g, ''); }
    const stat = el('text', { x: x + 14, y: y + h - 9, class: 'n-s' }, g, '等待');
    g.addEventListener('click', () => select(id));
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(id); } });
    nodeEls[id] = { g, val, unit, stat, w };
  }
  packetLayer = el('g', {}, svg);
  packets = [];
  paint();
}
function paint() {
  for (const [id, n] of Object.entries(nodeEls)) {
    n.g.classList.toggle('active', state.active.has(id));
    n.g.classList.toggle('sel', state.sel === id);
    n.stat.textContent = clip(state.status[id] || '等待', (n.w - 24) / 6.6);
    if (n.val) { const t = state.tokens[id] || 0; n.val.textContent = fmt(t); n.unit.textContent = 'token'; n.unit.setAttribute('x', +n.val.getAttribute('x') + n.val.getComputedTextLength() + 6); }
  }
  for (const [id, e] of Object.entries(edgeEls)) {
    const w = state.edges[id];
    e.g.classList.toggle('edge-on', !!w);
    if (w) { e.hot.setAttribute('stroke', colorOf(w)); e.glow.setAttribute('stroke', colorOf(w)); }
  }
}
function fit() {
  const cw = $('flowMod').clientWidth; const want = cw >= 720 ? 'wide' : cw >= 480 ? 'tall' : 'narrow';

}

function select(k) { state.sel = k; if (k === 'gate') state.tab = 'act'; renderInsp(); paint(); }

      p.appendChild(ul);
      const pre = document.createElement('pre'); pre.className = 'diff'; pre.innerHTML = DIFF; p.appendChild(pre);
    }
  } else {
    const pre = document.createElement('p'); pre.className = 'prompt'; pre.textContent = k === 'impl' && state.round > 1 ? FIX : TASK; p.appendChild(pre);
  }
  $('actions').hidden = !(k === 'gate' && state.active.has('gate'));
}
function setNow(text, who) { $('nowT').textContent = text; $('now').style.setProperty('--who', colorOf(who)); }
function log(k, kind, action, result) { (state.logs[k] = state.logs[k] || []).push({ time: stamp(), kind, action, result }); }
function tele() {
  const c = (state.tokens.plan || 0) + (state.tokens.rev || 0) + (state.tokens.verdict || 0), x = (state.tokens.impl || 0) + (state.tokens.re || 0), m = Math.max(c + x, 1);
  $('sClaude').textContent = '约 ' + fmt(c); $('sCodex').textContent = fmt(x);
  $('bClaude').style.width = c / m * 100 + '%'; $('bCodex').style.width = x / m * 100 + '%';
  $('cCmd').textContent = state.cmd; $('cFile').textContent = state.file; $('cIssue').textContent = state.issue;
  const sp = $('spark'); sp.textContent = '';
  const r = state.rate.slice(-40); if (r.length > 1) {
    const hi = Math.max(...r, 1); const d = r.map((v, i) => `${i ? 'L' : 'M'}${i * 200 / Math.max(r.length - 1, 1)} ${27 - v / hi * 25}`).join(' ');
    el('path', { d, fill: 'none', stroke: 'var(--hot)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }, sp);
  }
}

const STEPS = [
  { t: 1800, on: ['plan'], sel: 'plan', now: 'Claude 正在读 AGENTS.md 和 data/loader.py', who: 'claude', status: { plan: '读代码' }, tok: { plan: 6000 }, log: ['plan', '读取', '读取 AGENTS.md、data/loader.py', '4 个文件'] },
  { t: 1800, on: ['plan'], now: 'Claude 正在写任务书和 3 条验收标准', who: 'claude', status: { plan: '写任务书' }, tok: { plan: 6400 }, log: ['plan', '记录', '写出 3 条验收标准', ''] },
  { t: 2200, on: ['impl'], sel: 'impl', edges: { task: 'claude' }, flow: { task: 4000 }, now: 'Claude 把任务书交给 Codex（新线程）', who: 'claude', status: { plan: '已交付', impl: '接收任务' }, tok: { plan: 2000 }, log: ['plan', '记录', '交给 Codex', '--fresh'] },
  { t: 2200, on: ['impl'], now: 'Codex 正在搜索 mean_speed 的调用位置', who: 'codex', status: { impl: '运行命令' }, tok: { impl: 12000 }, cmd: 1, log: ['impl', '命令', 'rg -n "mean_speed" data tests', '找到 3 处'] },
  { t: 2600, on: ['impl'], now: 'Codex 正在修改 data/loader.py', who: 'codex', status: { impl: '改 loader.py' }, tok: { impl: 28000 }, file: { path: 'data/loader.py', add: 3, del: 1 }, log: ['impl', '改文件', '修改 data/loader.py', '+3 −1'] },
  { t: 2200, on: ['impl'], now: 'Codex 正在新增 tests/test_loader.py', who: 'codex', status: { impl: '写测试' }, tok: { impl: 21000 }, file: { path: 'tests/test_loader.py', add: 18, del: 0 }, log: ['impl', '改文件', '新增 tests/test_loader.py', '+18'] },

  { t: 2800, on: ['rev', 're'], sel: 'rev', edges: { toRev: 'codex', toRe: 'codex' }, flow: { toRev: 8000, toRe: 8000 }, now: 'Claude 和 Codex 正在分别审查同一份 diff', who: 'claude', status: { impl: '已交付', rev: '看 diff', re: '只读审查' }, tok: { rev: 15000, re: 9000 }, logs: [['rev', '读取', '查看完整 diff', '2 个文件'], ['re', '读取', '新线程审查同一份 diff', '只读']] },
  { t: 2400, on: ['rev', 're'], now: 'Claude 正在亲自运行 pytest，不采信 Codex 的汇报', who: 'claude', status: { rev: '跑测试', re: '没有发现问题' }, tok: { rev: 9000, re: 7000 }, cmd: 1, logs: [['rev', '命令', '亲自运行 pytest', '通过 21 项'], ['re', '记录', '没有发现阻塞问题', '']] },
  { t: 2400, on: ['verdict'], sel: 'verdict', edges: { revOut: 'claude', reOut: 'codex' }, flow: { revOut: 6000, reOut: 6000 }, now: 'Claude 正在汇总两份审查意见', who: 'claude', status: { rev: '发现 1 个问题', re: '已交付', verdict: '汇总意见' }, tok: { rev: 7000, verdict: 4000 }, issue: 1, logs: [['rev', '问题', '空窗口返回 None，调用方按 float 使用', '需修复'], ['verdict', '记录', '收到 2 份审查意见', 'Claude 1 个问题，Codex 无']] },
  { t: 2600, on: ['impl'], sel: 'impl', round: 2, edges: { back: 'claude' }, flow: { back: 8000 }, now: '裁决：打回。Claude 把修复清单交回 Codex（第 2 轮）', who: 'claude', status: { verdict: '打回 1 个问题', impl: '接收修复清单' }, tok: { verdict: 3000 }, log: ['verdict', '问题', '打回给 Codex，附修复清单', '第 2 轮'] },
  { t: 2400, on: ['impl'], now: 'Codex 正在按修复清单修改 data/loader.py', who: 'codex', status: { impl: '第 2 轮修复' }, tok: { impl: 15000 }, file: { path: 'data/loader.py', add: 1, del: 1 }, log: ['impl', '改文件', '按修复清单修改 data/loader.py', '+1 −1'] },
  { t: 2600, on: ['rev', 're'], edges: { toRev: 'codex', toRe: 'codex' }, flow: { toRev: 4000, toRe: 4000 }, now: 'Claude 和 Codex 正在复核第 2 轮的修复', who: 'claude', status: { impl: '已交付', rev: '复核修复', re: '复核修复' }, tok: { rev: 8000, re: 5000 }, cmd: 1, logs: [['rev', '命令', '亲自运行 pytest', '通过 21 项'], ['re', '记录', '复核通过', '']] },
  { t: 2200, on: ['verdict'], sel: 'verdict', edges: { revOut: 'claude', reOut: 'codex' }, flow: { revOut: 4000, reOut: 4000 }, now: 'Claude 正在逐条核对 3 条验收标准', who: 'claude', status: { rev: '通过', re: '通过', verdict: '核对标准' }, tok: { verdict: 3000 }, log: ['verdict', '记录', '3 条验收标准全部满足', '通过'] },
  { t: 5000, on: ['gate'], sel: 'gate', edges: { pass: 'human' }, flow: { pass: 6000 }, now: '等你决定：合并到主分支，或者放弃这次改动', who: 'human', status: { verdict: '通过', gate: '等待你的决定' }, log: ['gate', '记录', '改动在分支 console/empty-window', '主分支没有动'] },
];

let idx = -1, elapsed = 0, clock = 0, nextAt = 1000, paused = false, queue = [];
function advance() {
  idx += 1;
  if (idx >= STEPS.length) { reset(); return; }
  const s = STEPS[idx];
  state.active = new Set(s.on); state.edges = s.edges || {};
  Object.assign(state.status, s.status || {});
  let sum = 0;
  for (const k in s.tok || {}) { state.tokens[k] = (state.tokens[k] || 0) + s.tok[k]; sum += s.tok[k]; }
  state.rate.push(sum);
  if (s.cmd) state.cmd += s.cmd;
  if (s.issue) state.issue += s.issue;
  if (s.file) { const fs = state.files.impl = state.files.impl || []; const f = fs.find(x => x.path === s.file.path); if (f) { f.add += s.file.add; f.del += s.file.del; } else { fs.push({ ...s.file }); state.file += 1; } }
  (s.logs || (s.log ? [s.log] : [])).forEach(l => log(l[0], l[1], l[2], l[3]));
  if (s.round) { state.round = s.round; $('r' + s.round).classList.add('on'); $('rt').textContent = `第 ${s.round} 轮`; }
  setNow(s.now, s.who);
  for (const id in s.flow || {}) queue.push({ id, n: Math.round(s.flow[id] / TOKENS_PER_PACKET), gap: 0 });
  if (s.sel) state.sel = s.sel;
  renderInsp(); paint(); tele();
  nextAt = clock + s.t;
}
function reset() {
  idx = -1; elapsed = 0; state.tokens = {}; state.status = {}; state.logs = {}; state.files = {}; state.edges = {}; state.active = new Set(); state.cmd = state.file = state.issue = 0; state.rate = []; state.round = 1; queue = [];
  ['r2', 'r3'].forEach(i => $(i).classList.remove('on')); $('rt').textContent = '第 1 轮'; state.sel = 'plan';
  setNow('准备开始', 'claude'); renderInsp(); paint(); tele(); nextAt = clock + 1200;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 60); last = now;
  if (!paused) {
    clock += dt; elapsed += dt; $('clock').textContent = stamp();
    if (clock >= nextAt) advance();
    for (const q of queue) {
      q.gap -= dt;
      if (q.n > 0 && q.gap <= 0 && edgeEls[q.id]) {
        const who = state.edges[q.id] || 'hot';
        const r = el('rect', { width: 7, height: 2.5, x: -3.5, y: -1.25, fill: colorOf(who) }, packetLayer);
        packets.push({ r, e: edgeEls[q.id], at: 0 }); q.n -= 1; q.gap = 170;
      }
    }
    queue = queue.filter(q => q.n > 0);
    packets = packets.filter(p => {
      p.at += dt * .14;
      if (p.at >= p.e.len) { p.r.remove(); return false; }
      const a = p.e.hot.getPointAtLength(p.at), b = p.e.hot.getPointAtLength(Math.min(p.at + 1, p.e.len));
      p.r.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI})`);
      return true;
    });
  }
  requestAnimationFrame(frame);
}
$('fast').onclick = () => { const on = $('fast').getAttribute('aria-checked') !== 'true'; $('fast').setAttribute('aria-checked', on); $('fastT').textContent = on ? 'Fast 开，额度消耗约 ×2.5' : 'Fast 关，标准档'; };
$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? '继续' : '暂停'; };

fit();
setNow('准备开始', 'claude');
renderInsp(); tele();
if (reduced) { while (idx < STEPS.length - 1) advance(); } else { requestAnimationFrame(frame); }
